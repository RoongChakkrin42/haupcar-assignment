services:
  db:
    image: imresamu/postgis:17-3.5 # multi-arch; official postgis/postgis has no arm64
    environment:
      POSTGRES_USER: haupcar
      POSTGRES_PASSWORD: haupcar
      POSTGRES_DB: haupcar
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haupcar -d haupcar"]
      interval: 2s
      timeout: 3s
      retries: 20

  # --- Production-like stack: docker compose --profile app up --build  → http://localhost:8080
  # Its own Postgres and upload volume, separate from the dev database above.
  app-db:
    profiles: [app]
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: haupcar
      POSTGRES_PASSWORD: haupcar
      POSTGRES_DB: haupcar
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haupcar -d haupcar"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    profiles: [app]
    build: { context: ., target: api }
    image: haupcar-api
    command: ["node", "dist/src/db/cli.js", "bootstrap"]
    environment: &api-env
      DATABASE_URL: postgres://haupcar:haupcar@app-db:5432/haupcar
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FILE_SIGNING_SECRET: ${FILE_SIGNING_SECRET:?set FILE_SIGNING_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@haupcar.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-password-123}
    depends_on:
      app-db: { condition: service_healthy }

  api:
    profiles: [app]
    image: haupcar-api
    environment: *api-env
    volumes:
      - app-uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    profiles: [app]
    build: { context: ., target: web }
    ports:
      - "8080:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  db-data:
  app-db-data:
  app-uploads:
