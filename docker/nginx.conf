server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # API, Swagger docs and signed file URLs all live under /api.
  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id; # same id in nginx and API logs
    client_max_body_size 11m; # uploads are capped at 10 MB by the API
  }

  # Hashed build assets never change.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: unknown paths render index.html and the client router takes over.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    # Only what the app loads: Google Fonts, OpenStreetMap tiles; Leaflet needs inline styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
